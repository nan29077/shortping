services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortping
      POSTGRES_USER: shortping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - shortping-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortping -d shortping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  shortping-postgres:
